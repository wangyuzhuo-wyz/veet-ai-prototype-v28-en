function invalidate(){if(!S.galleryDemo)clearTestProgress();S.observationStart=0;S.timerStart=0;S.timerOffset=0;S.timerEnded=false;S.packageChecked=false;S.intervalConfirm='';S.interval='';S.test='new';S.photo=false;S.afterPhoto=false;S.phase='apply';S.waxStep=0}

function start(entry){S.aftercareReturn=null;S.observationStart=0;S.careProduct=null;S.careReturn=null;const records=S.records;S={...S,findAreas:[],findSkins:[],catalogAll:entry==='owned',page:0,entry,gender:'',area:'',leg:'小腿',skin:'',kind:'any',damage:'',reaction:'',interval:'',experience:'',prior:'',method:'',lastTime:'',lastProduct:'',intervalConfirm:'',timerStart:0,timerOffset:0,timerEnded:false,photo:false,quality:'good',low:false,product:null,size:'',packageChecked:false,test:'new',phase:'apply',waxStep:0,comparison:true,afterPhoto:false,rating:'',discomfort:'',remark:'',query:'',filter:'all',history:[],galleryDemo:false,records};navigate(entry==='owned'?6:1)}

function finderChoices(key,opts){return `<div class="selection">${opts.map(([v,t])=>`<button class="${(S[key]||[]).includes(v)?'selected':''}" aria-pressed="${(S[key]||[]).includes(v)}" onclick="toggleFinder('${key}','${v}')">${t}</button>`).join('')}</div>`}
function toggleFinder(key,value){invalidate();S.damage='';S.reaction='';S[key]=key==='findSkins'&&(S[key]||[]).includes(value)?[]:[value];if(key==='findAreas')S.area=S.findAreas[0]||'';if(key==='findSkins')S.skin=({'114':'敏感','115':'干性','116':'中性'})[S.findSkins[0]]||'';render()}
function finderMatchesId(id){if(!S.gender)return false;const areas=S.findAreas?.length?S.findAreas:[S.area];if(!areas[0])return false;const skins=S.gender==='女'&&S.findSkins?.length?S.findSkins:[''];return skins.some(k=>areas.some(a=>(OFFICIAL_FINDER.single_condition_results[[S.gender==='男'?'7':'6',k,AREA_IDS[a]].join('|')]||[]).includes(id)))}
function setCatalogAll(all){S.catalogAll=all;S.filter='all';S.query='';render()}
function catalogMarkup(){if(S.filter==='care')return careCatalog();let entries=OFFICIAL_FINDER.catalog.map(d=>PRODUCTS.find(p=>p.id===d.id)).filter(Boolean).filter(p=>S.catalogAll||finderMatchesId(p.id));if(['cream','wax'].includes(S.filter))entries=entries.filter(p=>p.kind===S.filter);if(S.filter==='men')entries=entries.filter(p=>p.gender==='男');if(S.query)entries=entries.filter(p=>(p.name+(p.variant||'')).includes(S.query));return entries.length?entries.map(productCard).join(''):catalogResults([])}
function careAreaChoices(p){const search=S.findAreas?.length?S.findAreas:[S.area];const options=search.filter(a=>p.areas.includes(a));return options.length>1?`<div class="field"><b>本次实际护理部位（单选）</b><p class="muted">本产品匹配多个查找部位；本次测试、照片与指导仅关联下方一个部位。</p>${choices('area',options.map(a=>[a,a]))}</div>`:''}

function screeningNext(){if(!S.damage||!S.reaction)return setError('请完成使用前问题。');if(S.damage!=='no')return showModal('请先暂缓本次脱毛','你选择了有上述情况，或暂时无法确认。官网包装明确禁止在破损、晒伤等列明的皮肤状态下使用；蜡纸还要求皮肤未受刺激。如有红肿、刺痛或其他不适，请先暂缓，并核对手中产品的完整使用限制。','查看产品库',()=>navigate(6),'返回修改');if(S.reaction!=='no')return showModal('请先核对既往不良反应','你选择了曾有不良反应，或暂不确定。官网包装明确禁止用于曾对相应脱毛膏或蜡纸产生不良反应的皮肤。若暂不确定，请先核对既往情况和本次包装；不要直接把另一款产品视为适用，必要时咨询医生。','查看产品库',()=>navigate(6),'返回修改');navigate(3)}

function phraseText(text){if(!/[，。；！？：]/.test(text))return text;return (text.match(/[^，。；！？：]+(?:[，。；！？：]+[”’」』）]?|$)/g)||[text]).map(x=>`<span class="phrase">${x}</span>`).join('')}

function clockText(seconds){seconds=Math.max(0,Math.ceil(seconds));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function elapsedSeconds(){return S.timerOffset+(S.timerStart?(Date.now()-S.timerStart)/1000:0)}
function timerCard(p){const target=S.phase==='limit'?p.maximum:p.check;return `<div class="timerCard"><span class="badge">护理倒计时</span><p>${S.phase==='limit'?'距离总时长上限':'距离首次检查'}</p><div class="clock" id="creamTime">${clockText(target*60-elapsedSeconds())}</div><p class="muted" id="elapsedLabel">累计时间 ${clockText(elapsedSeconds())} · 总上限 ${p.maximum}:00</p>${!S.timerStart?primary('开始倒计时','startCreamTimer()'):''}${secondary(S.phase==='limit'?'跳过等待，查看清除':'跳过倒计时，预览检查','skipCreamTimer()')}<p class="muted">跳过仅预览下一界面，不代表实际已等待。<br>切换页面不重置累计时间。</p></div>`}

function tickCream(){if(!S.timerStart||S.timerEnded||!product())return;const p=product(),elapsed=elapsedSeconds();if(elapsed>=p.maximum*60){S.timerStart=0;S.timerEnded=true;S.phase='rinse';if(view==='prototype'&&S.page===9){render();toast('已达总时长上限：查看清除与清洗')}return}if(elapsed>=p.check*60&&S.phase==='apply'){S.phase='check';if(view==='prototype'&&S.page===9)render()}if(view==='prototype'&&S.page===9){const el=document.querySelector('#screen #creamTime');if(el)el.textContent=clockText((S.phase==='limit'?p.maximum:p.check)*60-elapsed);const label=document.querySelector('#screen #elapsedLabel');if(label)label.textContent='累计时间 '+clockText(elapsed)+' · 总上限 '+p.maximum+':00'}}
setInterval(tickCream,250);

if(page===2)s=`<h2>查找条件与使用前筛查</h2>${S.gender==='女'?`<b>肤质条件</b>${finderChoices('findSkins',[['114','敏感肌肤'],['115','干性肌肤'],['116','中性肌肤']])}<p class="muted">暂不确定可不选，不限制肤质条件。</p><details class="skinHelp card pale"><summary>如何选择肤质？</summary><p class="muted">请参考本次脱毛部位平时的状态：</p><p class="muted"><b>敏感肌肤：</b>日常容易因护肤品、摩擦等出现刺激或不适。</p><p class="muted"><b>干性肌肤：</b>平时容易干燥、紧绷或起皮。</p><p class="muted"><b>中性肌肤：</b>平时较稳定，没有明显干燥或油腻感。</p><p class="muted">敏感与干燥可能同时存在；拿不准时可暂不选择肤质。</p><p class="muted">当前有破皮、红肿、刺痛等情况，请在下方如实填写。</p><p class="muted">仅帮助描述日常状态，不作为肤质诊断。</p><p class="muted">参考资料（英文）：<br><a href="https://www.aad.org/public/everyday-care/skin-care-basics/care/skin-care-budget" target="_blank" rel="noopener">美国皮肤科学会：常见肤质说明 ↗</a><br><a href="https://www.aad.org/public/everyday-care/skin-care-basics/dry/dermatologists-tips-relieve-dry-skin" target="_blank" rel="noopener">美国皮肤科学会：干燥与刺激表现 ↗</a><br><a href="https://www.uab.edu/news/news-you-can-use/how-to-approach-skin-care-according-to-your-skin-type" target="_blank" rel="noopener">UAB：不同肤质的日常特点 ↗</a></p></details>`:'<p class="muted">官网男士选品不设置肤质选项，按所选部位查找。</p>'}${radios('该部位现在有破皮、红肿、刺痛、晒伤或其他不适吗？','damage',[['no','没有上述情况'],['yes','有上述情况，或暂时无法确认']])}${radios('使用脱毛产品是否曾有不良反应','reaction',[['no','否或未使用过'],['yes','是或不确定']])}<p class="muted">筛查针对本次实际护理部位：${esc(S.area)}。多部位护理需分别核对，照片不能判断皮肤耐受。</p><div class="error" id="formError"></div>${primary('继续','screeningNext()')}`;

if(page===8)s=`<span class="badge">使用前确认 · ${S.packageChecked?'2 / 2':'1 / 2'}</span><h2>${S.packageChecked?'使用前先完成测试':'先核对包装与间隔'}</h2><p class="muted">${p.name} ${p.variant}<br>官网规格：${specList(p.sizes)}<br>${esc(S.area)} · 本次护理</p>${!S.packageChecked?`<div class="card pale"><h3>先核对实际包装</h3><p class="muted">确认名称、类型、规格、适用部位和使用说明。<br>官网资料不能完全替代手中版本。</p></div>${intervalFields()}<div class="error" id="formError"></div>${primary('已核对，继续局部测试',"confirmPackage()")}${secondary('返回产品详情','navigate(7)')}`:S.test==='new'?`<span class="badge">局部测试</span><div class="step"><div class="stepnum">1</div><div><b>按说明完成小范围测试</b><p>在本次目标部位小范围使用，并按该产品方法清除。</p></div></div><div class="step"><div class="stepnum">2</div><div><b>记录完成时间并观察</b><p>该产品官网说明要求观察 24 小时。</p></div></div>${primary('已完成局部试用，开始观察','beginObservation()')}${testSaveNotice()}`:S.test==='waiting'?`<span class="badge">观察中</span><div class="card pale"><p>距离观察结束还有</p><h3 id="observationRemaining">${S.observationStart?observationRemaining():'24 小时'}</h3><p class="muted">${S.observationStart?'预计 '+observationEnd()+' 结束':'请记录实际试用完成时间后开始观察。'}</p></div><div class="notice">请按产品说明完成24小时观察。此原型可直接进入下一步，供测试与展示；实际使用仍需完成观察。若出现不适，请及时停止使用并处理。</div><button class="primary" onclick="openObservationFeedback()">观察结束后填写反馈</button>${secondary('有不适或不确定','blockTest()')}${testSaveNotice()}`:S.test==='feedback'?`<span class="badge">观察后反馈</span><div class="card"><h3>测试部位是否出现不适？</h3><p class="muted">观察结束仍需主动反馈，不能自动判定通过。</p></div>${primary('无不适，继续',"passTest()")}${secondary('有不适或不确定',"blockTest()")}${testSaveNotice()}`:S.test==='passed'?`<div class="card pale"><h3>已记录无不适反馈</h3><p class="muted">本次产品与部位的测试反馈已记录。请按每次使用前的测试要求确认。</p></div>${primary('查看使用指导','passTest()')}`:`${pausePanel(p)}`}<p class="muted">每次使用前检查测试；更换产品或部位后重新核对。</p>`;

if(page===10){const steps=[['揭开蜡纸','捏住宽弧形易拉尾翼，慢慢揭开。','从尾翼分开，不直接触碰蜡面'],['顺向敷贴','沿毛发生长方向敷贴并抚平，确保贴合。','图中毛发向右生长，顺向抚平也向右'],['逆向撕除','保持肌肤绷紧，<br>逆毛发生长方向贴近皮肤快速撕除。','图中毛发向右生长，从右向左贴近皮肤快速撕除；右端向左折回，不要垂直向上拉'],['清理残蜡','使用随附清洁湿巾处理多余蜡渍。','采用随附湿巾，操作依据对应包装']];const x=steps[S.waxStep];s=`<span class="badge">步骤图解 · 无操作计时</span><h2>按说明使用蜡纸</h2><p class="muted">薇婷净纯脱毛蜡纸<br>官网规格：${specList(p.sizes)}</p><div class="waxProgress">${steps.map((_,i)=>`<span class="${i===S.waxStep?'current':i<S.waxStep?'done':''}">${i+1}</span>`).join('')}<b>${S.waxStep+1} / 4</b></div><div class="waxArt"><img src="assets/wax-watercolor-${S.waxStep+1}.png" alt="${x[0]}操作示意：${x[2]}"></div>${S.waxStep===1?'<div class="directionLegend"><span>毛发生长 →</span><b>顺向抚平 →</b></div>':S.waxStep===2?'<div class="directionLegend"><span>毛发生长 →</span><b>← 撕除方向</b></div>':''}<span class="badge gray">STEP 0${S.waxStep+1}</span><h2>${x[0]}</h2><p>${x[1]}</p><div class="card pale"><b>操作重点</b><p class="muted">${x[2]}</p></div>${S.waxStep<3?primary('下一步',"S.waxStep++;render()"):primary('完成步骤，记录体验','navigate(11)')}${S.waxStep>0?secondary('上一步',"S.waxStep--;render()"):''}${secondary('出现不适','stopForDiscomfort()')}<p class="muted">图解为原创水彩操作示意；按手中包装操作。避免同一区域反复操作；局部测试与再次使用间隔要求仍保留。</p>`}
if(page===11)s=`<span class="badge">护理反馈</span><h2>记录本次护理</h2>${S.photo&&photoSupported()?`<p class="muted">先确认肌肤清洁、无产品覆盖且没有不适，再记录照片。不为拍照延误清除。</p>${!S.afterPhoto?`${primary('拍摄护理后照片',"captureAfter()")}`:`<div class="row"><div>${skinImage(12,'护理前')}</div><div>${skinImage(3,'护理后')}</div></div>${S.comparison?coverageComparison()+aiReview(true):'<div class="card pale"><b>两张照片的拍摄条件不一致</b><p class="muted">请检查光线、角度与区域一致性，避免直接判断护理效果。</p></div>'}<button class="textbtn" onclick="S.comparison=!S.comparison;render()">切换可比与不可比状态</button>`}`:'<div class="card pale">本次没有图像对比。你仍可记录使用体验。</div>'}${radios('使用满意度','rating',[['满意','满意'],['一般','一般'],['不满意','不满意']])}${radios('本次是否出现不适','discomfort',[['无','无'],['有','有'],['不确定','不确定']])}<label class="muted">备注（可选）<textarea aria-label="护理备注" onchange="S.remark=this.value">${esc(S.remark)}</textarea></label><div class="error" id="formError"></div>${primary('保存护理记录','saveRecord()')}<div id="aftercareSlot">${aftercarePanel()}</div>`;
if(page===12)s=`<h2>我的护理记录</h2><p class="muted">记录仅在当前页面保存，刷新后清空。</p>${S.records.length?S.records.map((r,i)=>`<div class="card"><span class="badge">护理记录</span><h3>${esc(r.area)} · ${esc(r.name)}</h3><p class="muted">${recordSpecs(r.size)}<br>${r.hasComparison?'脱毛前覆盖率 '+formatCoverage(r.coverageBefore)+'% → 脱毛后 '+formatCoverage(r.coverageAfter)+'%<br>相对下降 '+formatRelative(coverageDifference(r.coverageBefore,r.coverageAfter).relative)+'%（下降 '+formatCoverage(coverageDifference(r.coverageBefore,r.coverageAfter).points)+' 个百分点）':'未记录可比的前后照片'}<br>满意度：${esc(r.rating)} · 不适：${esc(r.discomfort)}</p>${r.remark?'<p class="muted">备注：'+esc(r.remark)+'</p>':''}<button class="textbtn" onclick="deleteRecord(${i})">删除记录</button></div>`).join(''):'<div class="card pale">还没有护理记录。完成护理后可在这里回看。</div>'}<blockquote class="brandQuote"><svg class="quoteMark quoteOpen" viewBox="0 0 129 112" aria-hidden="true" focusable="false"><path d="M0 112V57C0 35 6 15 17 0H41C30 18 25 37 25 57H54V112Z" fill="#ff99c8"/><path d="M75 112V57C75 35 81 15 92 0H116C105 18 100 37 100 57H129V112Z" fill="#ffe1ee"/></svg><p>让每个人自由展露肌肤</p><p>自信展示自我<br>尽享美好生活</p><svg class="quoteMark quoteClose" viewBox="0 0 129 112" aria-hidden="true" focusable="false"><path d="M0 112V57C0 35 6 15 17 0H41C30 18 25 37 25 57H54V112Z" fill="#ff99c8"/><path d="M75 112V57C75 35 81 15 92 0H116C105 18 100 37 100 57H129V112Z" fill="#ffe1ee"/></svg></blockquote>${primary('开始新的护理',"start('choose')")}`;
if(page===13)s=`<h2>我的</h2><div class="card"><h3>数据与隐私</h3><p class="muted">照片不上传。待完成测试的产品、部位、筛查答案及观察时间保存在本机，供下次打开继续；仅保留一项，不包含照片。清除浏览器或小程序数据后无法找回。护理记录仍仅在本次页面会话保存，刷新即清空。</p>${secondary('清除待完成测试','discardPendingTest()')}${secondary('清空护理记录','deleteAll()')}</div><div class="card"><h3>产品说明</h3><a href="https://www.veet.com.cn" target="_blank" rel="noopener">查看薇婷官网产品说明 ↗</a></div><p class="muted">请按对应产品说明完成护理。</p>`;
return formatSmallText(s)}
function catalogResults(list){return list.length?list.map(productCard).join(''):'<div class="card pale"><h3>暂无完全匹配的候选产品</h3><p class="muted">可调整官网查找条件或查看全部产品；没有结果时不会自行添加其他推荐。</p></div>'}
function updateCatalog(){document.getElementById('catalogResults').innerHTML=formatSmallText(catalogMarkup())}
function passTest(){resolveInterval();if(!S.packageChecked||S.interval!=='no'||suitability(product())[0]!=='supported')return showModal('先完成使用前确认','请先核对包装、再次使用间隔及皮肤状态，再完成局部测试。','返回核对',()=>navigate(8),'返回修改',()=>navigate(2));S.test='passed';if(!S.galleryDemo)clearTestProgress();navigate(product().kind==='wax'?10:9)}
function captureAfter(){if(S.discomfort!=='无')return setError('请先在下方记录是否不适；仅无不适时继续拍照。');S.afterPhoto=true;render()}
function saveRecord(){if(!S.rating||!S.discomfort)return setError('请记录满意度和是否不适。');if(S.discomfort!=='无')return showModal('暂停图像评估','你反馈有不适或不确定，请先停止脱毛并处理不适。'+discomfortAdvice(product())+' 暂不继续采集照片或评估效果；可以仅保存体验记录。','保存体验记录',()=>commitRecord(false),'返回修改');commitRecord(S.photo&&S.afterPhoto&&S.comparison&&photoSupported())}
function commitRecord(hasComparison){const p=product();S.records.push({area:S.area,name:(p?.name??'未选产品')+' '+(p?.variant??''),size:'官网规格：'+p.sizes.join(' / '),rating:S.rating,discomfort:S.discomfort,remark:S.remark,hasComparison,coverageBefore:hasComparison?COVERAGE_EXAMPLE.before:null,coverageAfter:hasComparison?COVERAGE_EXAMPLE.after:null});navigate(12);toast('已保存本次护理记录')}
function deleteRecord(i){showModal('删除护理记录','删除本条护理记录后无法在当前会话恢复。','确认删除',()=>{S.records.splice(i,1);render();toast('已删除护理记录')})}
function deleteAll(){showModal('清除护理记录','此操作仅清除当前页面会话内的护理记录。','确认清除',()=>{S.records=[];render();toast('已清除护理记录')})}
function showModal(title,msg,action='知道了',cb=null,cancelLabel='返回',cancelCb=null){document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${phraseContent(esc(msg))}</p><button class="primary" id="modalConfirm">${esc(action)}</button><button class="secondary" id="modalCancel">${esc(cancelLabel)}</button></div></div>`;document.getElementById('modalConfirm').onclick=()=>{closeModal();if(cb)cb()};document.getElementById('modalCancel').onclick=()=>{closeModal();if(cancelCb)cancelCb()};document.getElementById('modalConfirm').focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2400)}
function sample(page){S.aftercareReturn=null;S.careProduct=null;S.careReturn=null;S.findAreas=['腿部'];S.findSkins=['114'];S.catalogAll=false;S.gender='女';S.area='腿部';S.leg='小腿';S.skin='敏感';S.kind='any';S.damage='no';S.reaction='no';S.interval='no';S.prior='no';S.method='';S.lastTime='';S.lastProduct='';S.intervalConfirm='yes';S.timerStart=0;S.timerOffset=0;S.timerEnded=false;S.product=page===10?'71':'80';S.size=page===10?'16 片':'100 ml';S.photo=![10,13].includes(page);S.afterPhoto=page===11;S.test=page===8?'feedback':'passed';S.packageChecked=page!==8;S.phase='apply';S.waxStep=0;S.quality='good';S.low=false;S.comparison=true;S.query='';S.filter='all';S.rating='';S.discomfort='';S.history=[];S.entry='choose';S.galleryDemo=true;S.observationStart=0;if(page===8){S.packageChecked=true;S.test='waiting';S.observationStart=Date.now()}S.page=page}
function jump(page){if(view!=='prototype')document.getElementById('pageSelect').innerHTML=PAGES.map((n,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} ${n}</option>`).join('');switchView('prototype');if(page===0){start('choose');S.page=0;S.history=[];render()}else{sample(page);render()}}
function render(){document.getElementById('pageSelect').value=String(S.page);persistTestProgress();document.getElementById('screen').innerHTML=draft(S.page);document.getElementById('screen').scrollTop=0;document.getElementById('pagemenu').innerHTML=PAGES.map((n,i)=>`<button class="navbutton ${i===S.page?'active':''}" onclick="jump(${i})">${String(i+1).padStart(2,'0')} ${n}</button>`).join('');document.getElementById('annotations').innerHTML=`<span class="badge gray">P${String(S.page+1).padStart(2,'0')} · 设计说明</span><h3 style="margin-top:14px">${NOTES[S.page][0]}</h3><ul><li>${NOTES[S.page][1]}</li><li>${NOTES[S.page][2]}</li></ul>${S.galleryDemo?'<div class="notice pink">当前为目录载入的示例状态。回首页可从空白表单体验主流程。</div>':''}<p>产品资料核验：2026-10-08<br>本集合为设计原型，待完成测试使用本机存储演示恢复，正式小程序需接入对应存储能力。尚未接入真实相机、AI、云保存或提醒服务，不用于实际护理。</p>`;const tabs=document.getElementById('tabs');tabs.classList.toggle('hidden',![0,12,13].includes(S.page));tabs.innerHTML=[[0,'护理'],[12,'记录'],[13,'我的']].map(([i,t])=>`<button class="${S.page===i?'selected':''}" onclick="navigate(${i})">${t}</button>`).join('')}
function buildOverview(){const saved=JSON.parse(JSON.stringify(S));let result='';for(let i=0;i<PAGES.length;i++){sample(i);if(i===0)S.page=0;result+=`<article class="preview"><div class="previewtitle">P${String(i+1).padStart(2,'0')} ${PAGES[i]}</div><div class="previewbody">${draft(i)}</div></article>`}S=saved;document.getElementById('overview').innerHTML=result}
function switchView(v){view='prototype';render()}
document.getElementById('pageSelect').innerHTML=PAGES.map((n,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} ${n}</option>`).join('');switchView('prototype');
</script><script src="translation.js"></script></body></html>
